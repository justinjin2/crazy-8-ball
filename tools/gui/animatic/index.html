<style>
/* Layout: the game view on top (it is the point), the controls under it in a compact grid,
   the JSON at the bottom. Dark navy like the card, so the game view reads as the game. */
:root {
  --night: #0b1240;
  --panel: #131d5c;
  --line: #2a3a8c;
  --ink: #eef3ff;
  --muted: #a9b6e6;
  --gold: #ffc83a;
  --cyan: #46d7ff;
  --display: "Fredoka One", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
body { background: var(--night); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; gap: 16px; }
h1 { font: 28px var(--display); color: var(--gold); margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 72ch; color: var(--muted); }
#view { width: 100%; height: auto; display: block; border-radius: 12px; background: #7fb8e8; aspect-ratio: 1748 / 804; max-width: 100%; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, .seg label { font: 700 14px var(--body); color: var(--night); background: var(--cyan); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.seg { display: inline-flex; gap: 0; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); padding: 2px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { background: transparent; color: var(--ink); padding: 5px 12px; }
.seg input:checked + label { background: var(--gold); color: var(--night); }
.clock { font: 700 14px var(--body); font-variant-numeric: tabular-nums; color: var(--gold); min-width: 9ch; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; min-width: 0; }
.ctl label { font-weight: 700; }
.ctl output { font-variant-numeric: tabular-nums; color: var(--gold); }
.ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
.ctl small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--gold); width: 18px; height: 18px; }
textarea { width: 100%; min-height: 150px; background: #070c2c; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">

<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Easing: Roblox TweenService's curves (EasingStyle x EasingDirection), written out so the
// animatic matches the game. `p` runs 0..1.
const Ease = {
  Linear: p => p,
  Sine: p => 1 - Math.cos(p * Math.PI / 2),
  Quad: p => p * p,
  Cubic: p => p * p * p,
  Quart: p => p ** 4,
  Quint: p => p ** 5,
  Exponential: p => (p === 0 ? 0 : 2 ** (10 * p - 10)),
  Circular: p => 1 - Math.sqrt(1 - p * p),
  Back: p => p * p * (2.70158 * p - 1.70158), // s = 1.70158, as TweenService
  Elastic: p => (p === 0 || p === 1 ? p : -(2 ** (10 * p - 10)) * Math.sin((p * 10 - 10.75) * (2 * Math.PI / 3))),
  Bounce: p => 1 - bounceOut(1 - p),
};
function bounceOut(p) {
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375;
  return n * (p -= 2.625 / d) * p + 0.984375;
}
function ease(style, dir, p) {
  p = Math.min(1, Math.max(0, p));
  const f = Ease[style];
  if (dir === "In") return f(p);
  if (dir === "Out") return 1 - f(1 - p);
  return p < 0.5 ? f(p * 2) / 2 : 1 - f((1 - p) * 2) / 2; // InOut
}

// ---------------------------------------------------------------------------------------------
// The motion tokens (these are what "Copy values" exports and Config takes).
const DEFAULTS = {
  OpenSeconds: 1.4,     // the whole open, first piece to the flair landing
  Stagger: 0.04,        // between pieces of one group (the tabs, the buttons, a card's insides)
  PopSeconds: 0.28,     // one piece's pop
  PopFrom: 0.6,         // a pop starts this big...
  PopPeak: 1.1,         // ...grows past full size to this...
  PopPeakAt: 0.6,       // ...at this share of the pop, then settles at 1
  FadeSeconds: 0.1,     // a piece's fade in (alongside its pop)
  UnrollSeconds: 0.2,   // the panel opening up and down from a thin bar
  UnrollOvershoot: 1.04, // the panel's overshoot (of its height)
  SlamFrom: 1.6,        // the block slams in from this big
  FireworkBurstFps: 15,    // the Grand Opening card's mini fireworks play at half speed (designer)...
  FireworkBurstEvery: 1.5, // ...and burst half as often, calm like the ribbons
  CloseSeconds: 0.15,   // the close: everything fades while the panel folds to a line
  TabSeconds: 0.5,      // a tab switch: the new page's pieces stagger in over this
};
const SLIDERS = [
  ["OpenSeconds", "Open length", 1, 2, 0.05, "s", "the whole open (the designer asked for 1 to 2 s)"],
  ["Stagger", "Stagger", 0, 0.1, 0.005, "s", "between pieces in a group"],
  ["PopSeconds", "Pop length", 0.1, 0.5, 0.01, "s", "one piece's pop"],
  ["PopPeak", "Overshoot", 1, 1.25, 0.01, "×", "how far past full size a pop grows"],
  ["PopFrom", "Pop starts at", 0.3, 1, 0.05, "×", "a piece's size when it appears"],
  ["FadeSeconds", "Fade", 0.03, 0.3, 0.01, "s", "a piece's fade in"],
  ["UnrollSeconds", "Unroll", 0.1, 0.4, 0.01, "s", "the panel opening from a bar"],
];
const V = loadValues();
function loadValues() {
  try { const s = JSON.parse(localStorage.getItem("animatic.values") || "{}"), v = Object.assign({}, DEFAULTS);
    for (const k in DEFAULTS) if (typeof s[k] === "number") v[k] = s[k]; return v; } // only today's keys
  catch { return Object.assign({}, DEFAULTS); }
}
function saveValues() { try { localStorage.setItem("animatic.values", JSON.stringify(V)); } catch {} }

// ---------------------------------------------------------------------------------------------
// The pieces' curves: what Stage will do in game, per frame, from these numbers.
function popScale(p) { // 0..1 -> scale: from PopFrom up past PopPeak, settling at 1
  const k = V.PopPeakAt;
  if (p <= 0) return V.PopFrom;
  if (p < k) return V.PopFrom + (V.PopPeak - V.PopFrom) * ease("Quad", "Out", p / k);
  return V.PopPeak + (1 - V.PopPeak) * ease("Sine", "InOut", (p - k) / (1 - k));
}
function unrollShare(p) { // 0..1 -> the panel's height share, with an overshoot
  if (p <= 0) return 0;
  const k = 0.7;
  if (p < k) return V.UnrollOvershoot * ease("Quart", "Out", p / k);
  return V.UnrollOvershoot + (1 - V.UnrollOvershoot) * ease("Sine", "InOut", (p - k) / (1 - k));
}

// ---------------------------------------------------------------------------------------------
// Assets: the real files (the page sits in tools/gui/animatic/; published, beside assets/).
const BASE = location.pathname.includes("/tools/gui/animatic/") ? "../../../" : ""; // in the repo, or published beside assets/
const FILES = {
  pattern: "assets/ui/art/pattern.png", dots: "assets/ui/frame/dots_512.png", rays: "assets/ui/lucky-rays.png",
  basket: "assets/ui/icons/shop_basket.png", cash: "assets/ui/icons/cash_stack.png", star: "assets/ui/icons/star.png",
  tabFeatured: "assets/ui/icons/deals.png", tabBlocks: "assets/ui/icons/inventory.png", tabMoney: "assets/ui/icons/pack_4.png", tabPasses: "assets/ui/icons/passes.png",
  plate: "assets/ui/grand_opening/plate.png", block: "assets/ui/grand_opening/block.png", blockMask: "assets/ui/grand_opening/block_mask.png",
  crown: "assets/ui/grand_opening/crown.png", glow: "assets/ui/grand_opening/block_glow.png", bokeh: "assets/ui/grand_opening/bokeh_disc.png",
  ballNear: "assets/ui/grand_opening/ball_near.png", ballMid: "assets/ui/grand_opening/ball_mid.png", ballFar: "assets/ui/grand_opening/ball_far.png",
  starL: "assets/ui/grand_opening/star_left.png", starR: "assets/ui/grand_opening/star_right.png", flair: "assets/ui/grand_opening/flair_8ball.png",
  betaBg: "assets/ui/grand_opening/beta_bg.png", betaCode: "assets/ui/grand_opening/beta_code.png", betaRing: "assets/ui/grand_opening/beta_ring.png",
  betaCallouts: "assets/ui/grand_opening/beta_callouts.png", betaCue: "assets/ui/grand_opening/beta_cue.png", betaMask: "assets/ui/grand_opening/beta_cue_mask.png",
  mote: "assets/ui/grand_opening/beta_mote.png", goBg: "assets/ui/grand_opening/firework_bg.png", goCue: "assets/ui/grand_opening/firework_cue.png",
  goMask: "assets/ui/grand_opening/firework_cue_mask.png", rib1: "assets/ui/effects/firework_ribbons_1.png", rib2: "assets/ui/effects/firework_ribbons_2.png",
  sparkle: "assets/ui/effects/sparkle.png",
};
for (const c of ["gold", "pink", "cyan", "purple", "orange"]) FILES["fw_" + c] = `assets/ui/effects/firework_${c}.png`;
for (let i = 1; i <= 6; i++) FILES["confetti" + i] = `assets/ui/grand_opening/confetti_${i}.png`;
for (let i = 1; i <= 10; i++) FILES["panel" + i] = `assets/ui/grand_opening/beta_panel_${i}.png`;
const IMG = {};
function loadAll() {
  return Promise.all(Object.entries(FILES).map(([k, f]) => new Promise(res => {
    const im = new Image(); im.onload = () => res(); im.onerror = () => { console.warn("missing", f); res(); };
    im.src = BASE + f; IMG[k] = im;
  })));
}

// ---------------------------------------------------------------------------------------------
// Words and numbers (Strings and Config on the game side; here as read on 2026-10-06).
const WORDS = {
  Shop: "Shop", Money: "$1.07M", Featured: "FEATURED", Tabs: ["Featured", "Blocks", "Money", "Passes"], New: "NEW",
  Title: "GRAND OPENING", Subtitle: ["LUCKY BLOCK • ", "LIMITED", " • YOU COULD PULL..."], EndsIn: "Ends in 20d 23h",
  Beta: ["BETA", " CUE"], GO: ["FIREWORK", " CUE"], Unique: "UNIQUE", Limited: "LIMITED",
  BetaOdds: "0.3%", FireworkOdds: "3%", Save: "save %d%%",
};
const DEALS = [ // Config.Products.GrandOpening1/3/10 and Config.Shop.Deals.GrandOpening.Money
  { count: 1, robux: 49, was: null, money: 49000 },
  { count: 3, robux: 129, was: 147, money: 139000 },
  { count: 10, robux: 349, was: 490, money: 441000 },
];

// ---------------------------------------------------------------------------------------------
// Drawing helpers. The view is the Studio PC capture's size (1748 x 804, the game at 2x).
const cv = document.getElementById("view"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const INK = "#0a1030";
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function img(im, cx, cy, w, opts = {}) {
  if (!im || !im.width) return;
  const h = opts.h || im.height * w / im.width;
  ctx.save();
  ctx.globalAlpha *= opts.a ?? 1;
  if (opts.op) ctx.globalCompositeOperation = opts.op;
  ctx.translate(cx, cy);
  if (opts.rot) ctx.rotate(opts.rot);
  if (opts.s && opts.s !== 1) ctx.scale(opts.s, opts.s);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function text(str, x, y, size, opts = {}) {
  ctx.save();
  ctx.globalAlpha *= opts.a ?? 1;
  ctx.translate(x, y);
  if (opts.rot) ctx.rotate(opts.rot);
  if (opts.s && opts.s !== 1) ctx.scale(opts.s, opts.s);
  ctx.font = `${size}px ${opts.font || "'Fredoka One'"}`;
  ctx.textAlign = opts.align || "center"; ctx.textBaseline = "middle";
  if (opts.outline !== 0) {
    ctx.lineJoin = "round"; ctx.strokeStyle = opts.ink || INK; ctx.lineWidth = opts.outline ?? Math.max(4, size * 0.2);
    ctx.strokeText(str, 0, size * 0.06); ctx.strokeText(str, 0, 0); // the kit's ink lip, then the outline
  }
  ctx.fillStyle = opts.color || "#fff"; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function measure(str, size) { ctx.font = `${size}px 'Fredoka One'`; return ctx.measureText(str).width; }
// A flipbook frame, as an ImageLabel stepping ImageRectOffset.
function flip(im, frame, cols, rows, cx, cy, w, opts = {}) {
  if (!im || !im.width) return;
  const fw = im.width / cols, fh = im.height / rows;
  const i = Math.max(0, Math.min(cols * rows - 1, Math.floor(frame)));
  const sx = (i % cols) * fw, sy = Math.floor(i / cols) * fh;
  const h = w * fh / fw;
  ctx.save(); ctx.globalAlpha *= opts.a ?? 1; if (opts.op) ctx.globalCompositeOperation = opts.op;
  ctx.translate(cx, cy); if (opts.rot) ctx.rotate(opts.rot);
  ctx.drawImage(im, sx, sy, fw, fh, -w / 2, -h / 2, w, h); ctx.restore();
}
const tinted = {};
function tint(key, color) { // ImageColor3: white times a colour
  const id = key + color; if (tinted[id]) return tinted[id];
  const im = IMG[key]; if (!im || !im.width) return null;
  const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const g = c.getContext("2d"); g.drawImage(im, 0, 0); g.globalCompositeOperation = "multiply";
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height); g.globalCompositeOperation = "destination-in"; g.drawImage(im, 0, 0);
  return (tinted[id] = c);
}

// ---------------------------------------------------------------------------------------------
// The layout (game px at 2x; the computer layout; the phone restack comes with the build).
const L = {
  panel: { x: 128, y: 44, w: 1492, h: 716, r: 42 },
  header: 116,
  sheet: { x: 143, y: 160, w: 1462, h: 585, r: 30 },
  basket: [586, 108, 72], shop: [688, 106, 52],
  money: { x: 1318, y: 72, w: 182, h: 72 }, close: { x: 1506, y: 56, w: 102, h: 102 },
  tabs: { x: 1455, y: 190, w: 142, h: 124, gap: 8 },
  featured: [802, 204, 30],
  card: { x: 165, y: 232, w: 1275, h: 498, r: 28 },
};
// Card-local places (the card's top-left is 0, 0).
const C = {
  block: [182, 262, 300], crown: [192, 122, 170], glow: [182, 262, 560], rays: [182, 262, 620],
  newTag: [92, 66], endsIn: [182, 466, 30],
  title: [812, 54, 58], subtitle: [812, 112, 24], starL: [520, 66, 62], starR: [1104, 66, 62],
  beta: { x: 360, y: 140, w: 432, h: 196 }, go: { x: 808, y: 140, w: 448, h: 196 },
  rowGreen: 352, rowGold: 412, rowH: 52, btnX: 360, btnW: 288, btnGap: 16, save: 478,
  balls: [["ballFar", 700, 26, 92, 0.25], ["ballMid", 1232, 468, 112, 0.18], ["ballNear", 318, 470, 92, 0.32]],
  fireworks: [["fw_gold", 120, 96, 240], ["fw_pink", 28, 260, 170], ["fw_purple", 560, 36, 150], ["fw_orange", 1208, 60, 210]],
  confetti: [[1, 330, 40, 54, 0.4], [2, 1260, 250, 50, -0.6], [3, 650, 470, 46, 0.9], [4, 40, 420, 52, -0.3], [5, 1000, 20, 50, 1.2], [6, 760, 115, 40, -1.0]],
};

// ---------------------------------------------------------------------------------------------
// The timeline: section 4's order, its starts scaled by OpenSeconds (the 1.4 s plan).
function buildTimeline() {
  const k = V.OpenSeconds / 1.4, S = V.Stagger, T = [];
  const add = (id, kind, at, len, extra = {}) => T.push(Object.assign({ id, kind, at: at * k, len }, extra));
  add("panel", "unroll", 0, V.UnrollSeconds);
  add("header", "fade", 0.12, 0.15);
  ["basket", "shop", "money", "close"].forEach((id, i) => add(id, "pop", 0.18 + i * S, V.PopSeconds));
  WORDS.Tabs.forEach((_, i) => { add("tab" + i, "pop", 0.3 + i * S * 1.25, V.PopSeconds); if (i < 2) add("new" + i, "pop", 0.3 + i * S * 1.25 + 0.08, V.PopSeconds); });
  add("featured", "pop", 0.4, V.PopSeconds); add("featuredLines", "grow", 0.48, 0.15);
  add("card", "grow", 0.45, 0.15);
  add("block", "slam", 0.55, 0.22); add("burstBlock", "burst", 0.55, 2.1);
  add("crown", "drop", 0.65, 0.25); add("newTag", "pop", 0.72, V.PopSeconds);
  add("title", "pop", 0.6, V.PopSeconds); add("burstTitle", "burst", 0.62, 2.1);
  add("subtitle", "fade", 0.68, 0.15);
  ["beta", "go"].forEach((id, j) => {
    const at = 0.75 + j * 0.15;
    add(id, "pop", at, V.PopSeconds); add("burst_" + id, "burst", at, 2.1);
    ["Name", "Pills", "Odds", "Cue"].forEach((p, i) => add(id + p, "pop", at + 0.05 + i * S, V.PopSeconds));
  });
  [0, 1, 2].forEach(i => add("green" + i, "pop", 1.05 + i * S, V.PopSeconds));
  [0, 1, 2].forEach(i => add("gold" + i, "pop", 1.15 + i * S, V.PopSeconds));
  add("save", "fade", 1.25, 0.15); add("endsIn", "fade", 1.28, 0.15);
  add("flair", "drop", 1.3, 0.3);
  const end = Math.max(...T.map(e => e.at + (e.kind === "burst" ? 0 : e.len)));
  return { T, end };
}
let TL = buildTimeline();
function state(id, t) { // -> { a, s, p, on }
  const e = TL.T.find(x => x.id === id); if (!e) return { a: 1, s: 1, p: 1, on: true, landed: 0 };
  const p = (t - e.at) / e.len;
  if (reduce()) { const a = Math.min(1, Math.max(0, (t - e.at * 0.5) / 0.2)); return { a, s: 1, p: Math.min(1, Math.max(0, p)), on: a > 0, landed: e.at + e.len }; }
  if (p <= 0) return { a: 0, s: V.PopFrom, p: 0, on: false, landed: e.at + e.len };
  const a = Math.min(1, (t - e.at) / V.FadeSeconds);
  let s = 1;
  if (e.kind === "pop") s = popScale(p);
  const pc = Math.min(1, p);
  if (e.kind === "slam") s = pc < 0.6 ? V.SlamFrom + (1 - V.SlamFrom) * ease("Quad", "In", pc / 0.6) : 1 + 0.05 * Math.sin((pc - 0.6) / 0.4 * Math.PI) * (1 - (pc - 0.6) / 0.4);
  if (e.kind === "grow") s = ease("Quart", "Out", p);
  if (e.kind === "unroll") s = unrollShare(p);
  return { a: e.kind === "unroll" ? 1 : a, s, p: Math.min(1, p), on: true, landed: e.at + e.len, raw: p };
}

// ---------------------------------------------------------------------------------------------
// The player's clock. `t` is seconds since the open started; idle loops use it too.
let t = 0, playing = true, speed = 1, last = null, mode = "open", modeAt = 0;
const reduce = () => document.getElementById("reduce").checked;
const lower = () => document.getElementById("lower").checked;
function phaseOf(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 997; return h / 997 * Math.PI * 2; }

// ---------------------------------------------------------------------------------------------
// The frame.
function drawFrame() {
  const P = L.panel, st = state("panel", t);
  if (!st.on) return false;
  const closing = mode === "close" ? Math.min(1, (t - modeAt) / V.CloseSeconds) : 0;
  const share = Math.max(0.0, st.s * (1 - ease("Quad", "In", closing)));
  const h = Math.max(14, P.h * share), y = P.y + (P.h - h) / 2;
  ctx.save();
  ctx.globalAlpha = 1 - closing;
  // shadow, fill, rim (native shapes: crisp at every height)
  ctx.shadowColor = "rgba(10,30,80,.35)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  rr(P.x, y, P.w, h, Math.min(P.r, h / 2)); ctx.fillStyle = "#e3f1fe"; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineWidth = 6; ctx.strokeStyle = "#a9d4f5"; ctx.stroke();
  ctx.clip();
  if (share > 0.98 && closing === 0) {
    // the header band: its 8-ball pattern scrolls up-left at 45 degrees (a window sliding over

  const cue = state("goCue", tt), lowFx = lower(), still = reduce();
  // mini fireworks at random spots every 0.5 to 1 s
  if (!still) {
    const every = V.FireworkBurstEvery * (lowFx ? 2 : 1), slot = Math.floor(t / every);
    for (let k = slot - 4; k <= slot; k++) { if (k < 0) continue; const born = k * every, f = (t - born) * V.FireworkBurstFps; if (f >= 64) continue;
      const r = (k * 7919) % 1000 / 1000, r2 = (k * 104729) % 1000 / 1000, keys = ["fw_gold", "fw_pink", "fw_cyan", "fw_purple", "fw_orange"];
      const im = IMG[keys[k % 5]], s = 140 + r2 * 120; if (!im.width) continue;
      const fw = im.width / 8, i = Math.floor(f); g.drawImage(im, (i % 8) * fw, Math.floor(i / 8) * fw, fw, fw, r * w - s / 2, r2 * h - s / 2, s, s); }
  }
  if (!cue.on) return;
  const cx = w / 2, cy = h * 0.58, cueW = w * 0.98 * cue.s, rot = -14 * Math.PI / 180;
  g.save(); g.globalAlpha = cue.a;
  gimg(g, IMG.goCue, cx, cy, cueW, { rot, a: 0.3 + 0.2 * Math.sin(t * 1.8), filter: "blur(12px)" });
  gimg(g, IMG.goCue, cx, cy, cueW, { rot });
  // the ribbons: 32 frames over two sheets, a turn in 2.4 s, laid over the cue's canvas
  const fr = still ? 0 : Math.floor(t * 13.333) % 32, sheet = fr < 16 ? IMG.rib1 : IMG.rib2, i = fr % 16;
  if (sheet.width) {
    const fw = sheet.width / 2, fh = sheet.height / 8, box = [0.0243, 0.05, 0.9201, 0.9016];
    const ch = IMG.goCue.height * cueW / IMG.goCue.width;
    g.save(); g.translate(cx, cy); g.rotate(rot);
    g.drawImage(sheet, (i % 2) * fw, Math.floor(i / 2) * fh, fw, fh, -cueW / 2 + box[0] * cueW, -ch / 2 + box[1] * ch, (box[2] - box[0]) * cueW, (box[3] - box[1]) * ch);
    g.restore();
  }
  g.restore();
}
function drawButtons(tt) {
  DEALS.forEach((d, i) => {
    const x = C.btnX + i * (C.btnW + C.btnGap) + C.btnW / 2;
    for (const [row, y, top, bot, label] of [["green", C.rowGreen, "#5fe38a", "#26b04d", "robux"], ["gold", C.rowGold, "#ffe066", "#f5b40a", "money"]]) {
      const st = state(row + i, tt); if (!st.on) continue;
      ctx.save(); ctx.globalAlpha = st.a; ctx.translate(x, y + C.rowH / 2); ctx.scale(st.s, st.s);
      rr(-C.btnW / 2, -C.rowH / 2, C.btnW, C.rowH, 16); const g = ctx.createLinearGradient(0, -C.rowH / 2, 0, C.rowH / 2); g.addColorStop(0, top); g.addColorStop(1, bot);
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      // a shine sweeps across every ~3 s, staggered
      if (!reduce()) { const local = (t + i * 0.35 + (row === "gold" ? 1.4 : 0)) % 3; if (local < 0.5) { ctx.clip(); const sx = -C.btnW / 2 - 60 + local / 0.5 * (C.btnW + 120);
        const lg = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0); lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(.5, "rgba(255,255,255,.55)"); lg.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = lg; ctx.fillRect(-C.btnW / 2, -C.rowH / 2, C.btnW, C.rowH); } }
      ctx.restore();
      if (label === "robux") {
        const words = `${d.count} block${d.count > 1 ? "s" : ""} • ${d.robux}`, ww = measure(words, 23), wasW = d.was ? measure(String(d.was), 20) + 10 : 0;
        const left = x - (ww + wasW + 34) / 2;
        robuxGlyph(left + 12, y + C.rowH / 2, 13, st);
        text(words, left + 34 + ww / 2, y + C.rowH / 2, 23, { a: st.a, s: st.s, outline: 6 });
        if (d.was) { const wx = left + 34 + ww + 10 + wasW / 2 - 5; text(String(d.was), wx, y + C.rowH / 2, 20, { a: st.a * 0.95, s: st.s, color: "#ff5a5a", outline: 5 });
          ctx.save(); ctx.globalAlpha = st.a; ctx.strokeStyle = "#e0242f"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(wx - wasW / 2 + 4, y + C.rowH / 2 + 8); ctx.lineTo(wx + wasW / 2 - 6, y + C.rowH / 2 - 8); ctx.stroke(); ctx.restore(); }
      } else {
        const words = "$" + d.money.toLocaleString("en-US"); img(IMG.cash, x - measure(words, 28) / 2 - 30, y + C.rowH / 2, 56, { a: st.a, s: st.s, rot: -0.2 });
        text(words, x + 14, y + C.rowH / 2, 28, { a: st.a, s: st.s, outline: 6 });
      }
    }
    const sv = state("save", tt);
    if (sv.on && d.was) { const pct = Math.round((1 - d.robux / d.was) * 100), x0 = x;
      const rainbow = pct >= 20 && !reduce() ? `hsl(${(t * 120) % 360} 90% 65%)` : "#fff";
      text(WORDS.Save.replace("%d%%", pct + "%"), x0, C.save, 24, { a: sv.a, color: rainbow, outline: 5 }); }
  });
}
function robuxGlyph(x, y, r, st) {
  ctx.save(); ctx.globalAlpha = st.a; ctx.translate(x, y); ctx.scale(st.s, st.s); ctx.beginPath();
  for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath();
  ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 4.5; ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.fillRect(-r * 0.3, -r * 0.3, r * 0.6, r * 0.6); ctx.restore();
}
function drawFlair() {
  const st = state("flair", t); if (!st.on) return;
  const y0 = L.panel.y + 4, x0 = L.panel.x + 110; // the top edge near the left corner (the right has the money and X)
  const drop = (1 - ease("Bounce", "Out", st.p)) * -120;
  const hop = reduce() || t < st.landed ? 0 : (((t - st.landed) % 5) < 0.4 ? -18 * Math.sin(((t - st.landed) % 5) / 0.4 * Math.PI) : 0);
  img(IMG.flair, x0, y0 + drop + hop, 96, { a: st.a, rot: idleRock("flair", st, 0.1) });
}
function drawPoppers() {
  if (!opt("poppers") || reduce()) return;
  const e = TL.T.find(q => q.id === "card"); const f = (t - e.at) * 30;
  if (f >= 0 && f < 64) { flip(IMG.fw_gold, f, 8, 8, L.card.x + 20, L.card.y + L.card.h - 10, 260); flip(IMG.fw_pink, f, 8, 8, L.card.x + L.card.w - 20, L.card.y + L.card.h - 10, 260); }
}

// ---------------------------------------------------------------------------------------------
// Each frame.
function render() {
  ctx.clearRect(0, 0, W, H);
  // the world behind (a soft sky, standing in for the game)
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#8cc7f2"); sky.addColorStop(1, "#d9c3a8"); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(10,20,50,.25)"; ctx.fillRect(0, 0, W, H);
  const open = drawFrame();
  if (open) {
    // a tab switch: only the page's pieces, their reveal squeezed into TabSeconds, no unroll
    const from = TL.T.find(q => q.id === "featured").at;
    const tabT = mode === "tab" ? from + (t - modeAt) * (TL.end - from) / V.TabSeconds : t;
    drawFeatured(tabT); drawPoppers(); drawChrome(); drawFlair();
  }
  document.getElementById("clock").textContent = t.toFixed(3) + " s";
}
function tick(now) {
  if (last !== null && playing) { t += (now - last) / 1000 * speed; if (mode === "close" && t - modeAt > V.CloseSeconds + 0.4) replay(); }
  last = now; render(); requestAnimationFrame(tick);
}
function replay() { mode = "open"; t = 0; modeAt = 0; }

// ---------------------------------------------------------------------------------------------
// Controls.
function buildControls() {
  const box = document.getElementById("controls");
  for (const [key, label, min, max, step, unit, help] of SLIDERS) {
    const id = "v_" + key, wrap = document.createElement("div"); wrap.className = "ctl";
    wrap.innerHTML = `<label for="${id}">${label}</label><output id="o_${key}"></output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"><small>${help}</small>`;
    box.append(wrap);
    const input = wrap.querySelector("input"), out = wrap.querySelector("output");
    input.value = V[key]; out.textContent = (+V[key]).toFixed(3).replace(/0+$/, "").replace(/\.$/, "") + " " + unit;
    input.addEventListener("input", () => { V[key] = +input.value; out.textContent = (+input.value).toFixed(3).replace(/0+$/, "").replace(/\.$/, "") + " " + unit; TL = buildTimeline(); saveValues(); showJson(); });
    input.addEventListener("change", replay);
  }
  const reset = document.createElement("button"); reset.className = "ghost"; reset.textContent = "Reset to defaults";
  reset.addEventListener("click", () => { Object.assign(V, DEFAULTS); saveValues(); box.innerHTML = ""; buildControls(); TL = buildTimeline(); showJson(); replay(); });
  box.append(reset);
}
function showJson() {
  document.getElementById("json").value = JSON.stringify({ Motion: V, Toggles: { Streamers: opt("streamers"), Poppers: opt("poppers"), Twinkles: opt("twinkles") }, OpenEndsAt: +TL.end.toFixed(3) }, null, 2);
}
document.getElementById("replay").onclick = replay;
document.getElementById("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; };
document.getElementById("back").onclick = () => { playing = false; document.getElementById("play").textContent = "Play"; t = Math.max(0, t - 1 / 60); };
document.getElementById("fwd").onclick = () => { playing = false; document.getElementById("play").textContent = "Play"; t += 1 / 60; };
document.getElementById("closeBtn").onclick = () => { if (mode !== "close") { mode = "close"; modeAt = t; } };
document.getElementById("tab").onclick = () => { selectedTab = 0; mode = "tab"; modeAt = t; };
document.querySelectorAll("input[name=speed]").forEach(r => r.addEventListener("change", () => { speed = +r.value; }));
["streamers", "poppers", "twinkles", "lower", "reduce"].forEach(id => document.getElementById(id).addEventListener("change", () => { showJson(); }));
document.getElementById("copy").onclick = async () => {
  showJson(); const ta = document.getElementById("json");
  try { await navigator.clipboard.writeText(ta.value); document.getElementById("copied").textContent = "Copied"; }
  catch { ta.select(); document.getElementById("copied").textContent = "Selected: press Copy"; }
};
buildControls(); showJson();
// For checks: ?t=1.2 shows that moment, paused (local runs only; the published page has no query).
const query = new URLSearchParams(location.search);
if (query.has("t")) { t = +query.get("t"); playing = false; document.getElementById("play").textContent = "Play"; }
if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.getElementById("reduce").checked = true;
Promise.all([loadAll(), document.fonts.load("40px 'Fredoka One'").catch(() => {})]).then(() => requestAnimationFrame(tick));
</script>
